<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Carson Terry — AI systems and agents</title>
  <desc id="desc">Carson Terry’s name beside an illuminated isometric processor. Cyan and violet traces suggest the flow from intent through orchestration to execution.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#121b2b"/>
      <stop offset=".5" stop-color="#090e18"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="border" x2="1" y2="1">
      <stop stop-color="#37586b"/>
      <stop offset=".58" stop-color="#253044"/>
      <stop offset="1" stop-color="#504375"/>
    </linearGradient>
    <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="38" y1="122" x2="862" y2="342">
      <stop stop-color="#50a1cb"/>
      <stop offset=".65" stop-color="#6eeaff"/>
      <stop offset="1" stop-color="#a590ff"/>
    </linearGradient>
    <linearGradient id="name" x2="1" y2=".7">
      <stop stop-color="#fbfeff"/>
      <stop offset="1" stop-color="#a8cce1"/>
    </linearGradient>
    <linearGradient id="die" x2="1" y2="1">
      <stop stop-color="#2088aa"/>
      <stop offset=".53" stop-color="#172740"/>
      <stop offset="1" stop-color="#654ea5"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#098bc1" stop-opacity=".3"/>
      <stop offset=".59" stop-color="#3452b4" stop-opacity=".13"/>
      <stop offset="1" stop-color="#3452b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pin">
      <stop stop-color="#d8fbff"/>
      <stop offset=".27" stop-color="#5cf2ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#5cf2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#6e9bb6" stroke-opacity=".16"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="448" rx="19"/></clipPath>
    <style>
      .typing { animation: type 1.55s steps(19, end) both; }
      @keyframes type {
        from { clip-path: inset(0 100% 0 0) fill-box; }
        to { clip-path: inset(0 0 0 0) fill-box; }
      }
      @media (prefers-reduced-motion: reduce) {
        .typing { animation: none; }
        .motion { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="898" height="448" fill="url(#panel)"/>
    <path d="M434 62h466v320H434z" fill="url(#grid)"/>
    <ellipse cx="668" cy="224" rx="268" ry="195" fill="url(#halo)"/>
    <path d="M1 62h898M1 382h898M435 62v320" fill="none" stroke="#29394f"/>

    <g fill="none" transform="rotate(-11 662 231)">
      <ellipse cx="662" cy="231" rx="193" ry="101" stroke="#314764"/>
      <ellipse cx="662" cy="231" rx="181" ry="91" stroke="#5c89a6" stroke-opacity=".57" stroke-dasharray="2 6"/>
      <ellipse cx="662" cy="231" rx="149" ry="74" stroke="#345a79"/>
    </g>
    <path d="M662 98v255M476 231h373" fill="none" stroke="#59778f" stroke-opacity=".48" stroke-dasharray="4 7"/>
    <g stroke="#395978" stroke-width="1.25" fill="none">
      <path d="M470 184h48l38 26h27m-113 99h74l44-28h31m-127 52h73l44-28h27"/>
      <path d="M718 181h33l31-26h72m-117 47h37l32-22h48m-159 127h61l40 29h58"/>
      <path d="M547 115h44l28 19v26m92 0v-24l33-23h36m-168 197v24l-23 16h-30m147-30v18l39 19h26" stroke-dasharray="3 4"/>
    </g>
    <path d="M470 161h62l38 26h35l57 35 76 47h41l36 42h39" fill="none" stroke="url(#trace)" stroke-width="1.65" opacity=".76"/>
    <g fill="#0b1524" stroke="url(#trace)" stroke-width="1.5">
      <circle cx="470" cy="161" r="4"/>
      <circle cx="470" cy="184" r="3"/>
      <circle cx="470" cy="309" r="3"/>
      <circle cx="492" cy="333" r="3"/>
      <circle cx="854" cy="155" r="3"/>
      <circle cx="854" cy="180" r="3"/>
      <circle cx="854" cy="311" r="4"/>
      <circle cx="854" cy="336" r="3"/>
    </g>

    <g stroke-linejoin="round">
      <path d="M555 222l107 64 107-64v14l-107 64-107-64z" fill="#101c2f" stroke="#4a6787"/>
      <path d="M662 159 769 222 662 286 555 222Z" fill="#182b43" stroke="#5580a1"/>
      <path d="M662 286v13m-93-69v13m15-5v13m15-4v13m15-4v13m15-4v13m15-4v13m36-13v13m15-22v13m15-22v13m15-22v13m15-22v13m15-21v13" stroke="#5f8fae" stroke-opacity=".75"/>
      <path d="M662 176 739 222 662 268 585 222Z" fill="#0d192a" stroke="#5eacc2" stroke-opacity=".8"/>
      <path d="M662 184 726 222 662 260 598 222Z" fill="url(#die)" stroke="url(#trace)" stroke-width="1.6"/>
      <path d="M662 196l44 26-44 26-44-26zM662 206l28 16-28 16-28-16z" fill="none" stroke="url(#trace)" stroke-opacity=".84"/>
      <path d="M662 213l15 9-15 9-15-9z" fill="#a6f7ff"/>
      <path d="M662 188v-7m0 82v7m64-48h7m-135 0h-7" stroke="#c4f7ff"/>
      <circle cx="662" cy="222" r="38" fill="url(#pin)" opacity=".46"/>
    </g>

    <g class="motion" opacity="0">
      <circle r="12" fill="url(#pin)"/>
      <circle r="2.5" fill="#e8fcff"/>
      <animateMotion dur="4.6s" path="M470 161h62l38 26h35l57 35 76 47h41l36 42h39"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.10;.83;1" dur="4.6s"/>
    </g>
    <path class="motion" d="M466 116h394" stroke="#76ecff" stroke-width=".9" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 223" dur="4.6s"/>
      <animate attributeName="opacity" values="0;.23;.23;0" keyTimes="0;.15;.72;1" dur="4.6s"/>
    </path>

    <circle cx="37" cy="31" r="4" fill="#70eefa"/>
    <text x="53" y="38" fill="#a8c8de" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" letter-spacing="1">@realcarsonterry</text>
    <path d="M806 31h20m7 0h12m7 0h11M38 107h55" fill="none" stroke="url(#trace)" stroke-width="2.5" stroke-linecap="round"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="97" letter-spacing="-4.5" fill="url(#name)">
      <text x="32" y="200">Carson</text>
      <text x="32" y="288">Terry</text>
    </g>
    <text class="typing" x="39" y="342" fill="#8aebf7" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" letter-spacing="1.5">AI SYSTEMS &amp; AGENTS</text>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="1" fill="#b2cde1">
      <text x="39" y="421">INTENT</text>
      <text x="450" y="421" text-anchor="middle">ORCHESTRATION</text>
      <text x="861" y="421" text-anchor="end">EXECUTION</text>
    </g>
    <path d="M124 414h219m-7-5 7 5-7 5m221-5h184m-7-5 7 5-7 5" fill="none" stroke="url(#trace)" stroke-opacity=".63" stroke-width="1.5"/>
  </g>
  <rect x="1" y="1" width="898" height="448" rx="19" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M20 1h74M807 449h73" fill="none" stroke="url(#trace)" stroke-width="2" opacity=".7"/>
</svg>
