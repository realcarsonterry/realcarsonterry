name: Refresh contribution chart

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-contributions

jobs:
  update:
    if: github.repository == 'realcarsonterry/realcarsonterry' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render GitHub contribution chart
        run: node scripts/update-activity.mjs
      - name: Publish changed chart
        run: |
          if git diff --quiet -- assets/activity.svg assets/activity-compact.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity.svg assets/activity-compact.svg
          git commit -m 'Refresh contribution chart'
          git push origin HEAD
